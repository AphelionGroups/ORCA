<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>ORCA — Spatial Operating System</title>
  
  <!-- Critical External Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>

  <style>
    @layer base {
      html, body {
        margin: 0;
        padding: 0;
        background-color: #111317;
        color: #e2e2e8;
        font-family: 'Geist', 'Inter', -apple-system, sans-serif;
      }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Tailwind CSS with custom configuration -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#111317",
            "surface-dim": "#0e1013",
            "surface-container-lowest": "#0c0e12",
            "surface-container-low": "#16181d",
            "surface-container": "#1a1c22",
            "surface-container-high": "#22252c",
            "surface-container-highest": "#333539",
            "surface-bright": "#37393e",
            "surface-border": "#272a32",
            "outline": "#918f9e",
            "outline-variant": "#464552",
            "primary": "#8b8df8",
            "primary-container": "#8b8df8",
            "primary-fixed-dim": "#c1c1ff",
            "secondary": "#44e1de",
            "secondary-container": "#00c5c2",
            "tertiary": "#cebdff",
            "tertiary-container": "#a286f5",
            "text-main": "#ffffff",
            "text-muted": "#94a3b8",
            "text-dim": "#64748b",
            "on-surface": "#e2e2e8",

            "error-container": "#93000a"
          },
          fontFamily: {
            sans: ["Geist", "Inter", "sans-serif"],
            mono: ["GeistMono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Required React 18 & React Router v6.3.0 dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
  <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-[#111317] text-[#e2e2e8] antialiased selection:bg-primary/20 selection:text-white min-h-screen overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // --- SHARED SIDEBAR COMPONENT ---
    function Sidebar({ onOpenQuickCapture }) {
      const location = useLocation();
      const currentPath = location.pathname;

      const spaces = [
        { name: 'All Spaces', path: '/spaces' },
        { name: 'Kantor', path: '/spaces?space=kantor' },
        { name: 'Pribadi', path: '/spaces?space=pribadi' },
        { name: 'Bisnis A', path: '/canvas' },
        { name: 'Bisnis B', path: '/spaces?space=bisnis-b' }
      ];

      return (
        <aside className="fixed left-0 top-0 bottom-0 w-64 bg-[#111317] z-50 flex flex-col justify-between p-5 border-r border-white/10 select-none">
          <div className="flex flex-col gap-6">
            {/* Wordmark Header */}
            <div className="flex items-center justify-between px-1 pt-1">
              <Link to="/spaces" className="flex items-center gap-2 group">
                <span className="text-base font-semibold tracking-widest text-white uppercase group-hover:text-primary transition-colors">ORCA</span>
                <span className="h-1.5 w-1.5 rounded-full bg-secondary shadow-[0_0_8px_rgba(68,225,222,0.6)]"></span>
              </Link>
              <button 
                aria-label="Collapse sidebar" 
                className="w-7 h-7 rounded-sm hover:bg-white/[0.06] text-text-dim hover:text-white flex items-center justify-center transition-colors"
              >
                <span className="material-symbols-outlined text-[17px]">dock_to_right</span>
              </button>
            </div>

            {/* Spaces Switcher */}
            <div className="flex flex-col gap-1.5">
              <div className="px-2 text-[11px] uppercase tracking-widest text-text-dim font-medium flex items-center justify-between">
                <span>Spaces</span>
                <Link to="/spaces" className="hover:text-white transition-colors" title="Manage Spaces">
                  <span className="material-symbols-outlined text-[14px]">tune</span>
                </Link>
              </div>
              <div className="flex flex-col gap-0.5">
                {spaces.map(s => {
                  const isActive = (s.path === '/canvas' && ['/canvas', '/canvas-hub', '/documents', '/tasks'].includes(currentPath)) ||
                                   (s.path === '/spaces' && currentPath === '/spaces');
                  return (
                    <Link
                      key={s.name}
                      to={s.path}
                      className={`w-full text-left px-2.5 py-1.5 text-[13px] rounded-sm transition-all ${
                        isActive 
                          ? 'font-medium text-white bg-white/[0.08] border-l-2 border-primary rounded-r-sm pl-3 shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]' 
                          : 'text-text-muted hover:text-white hover:bg-white/[0.04]'
                      }`}
                    >
                      {s.name}
                    </Link>
                  );
                })}
              </div>
            </div>

            {/* Sub-project under active space */}
            <div className="pl-3 -mt-2">
              <div className="pl-3 border-l border-white/10 flex flex-col gap-0.5">
                <Link 
                  to="/canvas" 
                  className={`text-[12px] py-1 px-2 rounded-sm transition-colors ${['/canvas', '/canvas-hub', '/documents', '/tasks'].includes(currentPath) ? 'text-primary font-medium bg-primary/10' : 'text-text-dim hover:text-white'}`}
                >
                  Rebranding & Launch
                </Link>
              </div>
            </div>

            {/* Navigation Section */}
            <div className="flex flex-col gap-1.5">
              <div className="px-2 text-[11px] uppercase tracking-widest text-text-dim font-medium">
                Views
              </div>
              <nav className="flex flex-col gap-0.5">
                <Link 
                  to="/spaces" 
                  className={`flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-[13px] transition-colors ${
                    currentPath === '/spaces' 
                      ? 'text-white bg-white/[0.06] border border-white/5 font-medium' 
                      : 'text-text-muted hover:text-white hover:bg-white/[0.04]'
                  }`}
                >
                  <span className="material-symbols-outlined text-[17px] text-text-dim">grid_view</span>
                  <span>Spaces Master</span>
                </Link>

                <Link 
                  to="/canvas-hub" 
                  className={`flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-[13px] transition-colors ${
                    currentPath === '/canvas-hub' 
                      ? 'text-white bg-white/[0.06] border border-white/5 font-medium' 
                      : 'text-text-muted hover:text-white hover:bg-white/[0.04]'
                  }`}
                >
                  <span className="material-symbols-outlined text-[17px] text-secondary">dashboard</span>
                  <span>Canvas Hub</span>
                </Link>

                <Link 
                  to="/calendar" 
                  className={`flex items-center gap-2.5 px-2.5 py-1.5 rounded-sm text-[13px] transition-colors ${
                    currentPath === '/calendar' 
                      ? 'text-white bg-white/[0.06] border border-white/5 font-medium' 
                      : 'text-text-muted hover:text-white hover:bg-white/[0.04]'
                  }`}
                >
                  <span className="material-symbols-outlined text-[17px] text-primary">calendar_today</span>
                  <span>Calendar</span>
                </Link>
              </nav>
            </div>
          </div>

          {/* Quick Capture Bottom Button */}
          <div className="pt-4 border-t border-white/10">
            <button 
              onClick={onOpenQuickCapture}
              className="w-full flex items-center justify-between px-3 py-2 text-[13px] rounded-sm bg-[#181a20] hover:bg-[#20232a] text-text-muted hover:text-white border border-white/10 transition-all shadow-sm group" 
              type="button"
            >
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-[16px] text-secondary group-hover:rotate-12 transition-transform">bolt</span>
                <span className="font-medium">Quick Capture</span>
              </div>
              <span className="text-[11px] text-text-dim px-1.5 py-0.5 rounded border border-white/10 bg-white/[0.03] font-mono">⌘K</span>
            </button>
          </div>
        </aside>
      );
    }

    // --- QUICK CAPTURE MODAL OVERLAY ---
    function QuickCaptureModal({ isOpen, onClose, onSave }) {
      const [type, setType] = useState('Document');
      const [title, setTitle] = useState('');
      const [note, setNote] = useState('');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-fade-in">
          <div className="relative w-full max-w-md bg-[#181a20] border border-white/15 shadow-2xl rounded-lg p-5">
            <div className="flex items-center justify-between pb-3 mb-3 border-b border-white/10">
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-[18px] text-secondary">bolt</span>
                <h3 className="text-xs font-semibold text-white tracking-wider uppercase font-mono">Quick Capture & Link</h3>
              </div>
              <button onClick={onClose} className="text-text-dim hover:text-white transition-colors">
                <span className="material-symbols-outlined text-[17px]">close</span>
              </button>
            </div>

            <div className="space-y-3.5">
              <div className="flex items-center justify-between">
                <span className="text-[11px] text-text-dim uppercase font-mono tracking-wider">Target Type</span>
                <div className="flex gap-1 p-0.5 rounded bg-[#111317] border border-white/10 text-[11px]">
                  <button 
                    onClick={() => setType('Document')}
                    className={`px-3 py-1 rounded transition-colors ${type === 'Document' ? 'bg-primary/20 text-primary font-medium' : 'text-text-muted hover:text-white'}`}
                  >
                    Document
                  </button>
                  <button 
                    onClick={() => setType('Task')}
                    className={`px-3 py-1 rounded transition-colors ${type === 'Task' ? 'bg-secondary/20 text-secondary font-medium' : 'text-text-muted hover:text-white'}`}
                  >
                    Task
                  </button>
                </div>
              </div>

              <div>
                <label className="block text-[10px] text-text-dim mb-1 font-mono uppercase">Title</label>
                <input 
                  autoFocus
                  type="text" 
                  value={title} 
                  onChange={e => setTitle(e.target.value)}
                  placeholder={type === 'Document' ? "e.g., Packaging Visual Specs..." : "e.g., Finalize CAD Export..."}
                  className="w-full bg-[#111317] border border-white/10 rounded-sm px-3 py-1.5 text-xs text-white placeholder:text-text-dim focus:ring-1 focus:ring-primary focus:border-primary font-sans"
                />
              </div>

              <div>
                <label className="block text-[10px] text-text-dim mb-1 font-mono uppercase">Note Content</label>
                <textarea 
                  rows="3" 
                  value={note}
                  onChange={e => setNote(e.target.value)}
                  placeholder="Key thoughts, context reference, or markdown bullet points..."
                  className="w-full bg-[#111317] border border-white/10 rounded-sm px-3 py-1.5 text-xs text-text-muted placeholder:text-text-dim focus:ring-1 focus:ring-primary focus:border-primary font-sans resize-none"
                ></textarea>
              </div>

              <div className="flex items-center justify-between pt-2 border-t border-white/10 text-xs">
                <div className="flex items-center gap-1.5 text-text-dim font-mono text-[11px]">
                  <span className="material-symbols-outlined text-[14px]">folder</span>
                  <span>Bisnis A</span>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={onClose} className="px-3 py-1 text-text-muted hover:text-white">Cancel</button>
                  <button 
                    onClick={() => {
                      if (title.trim()) {
                        onSave({ type, title, note });
                        setTitle('');
                        setNote('');
                        onClose();
                      }
                    }}
                    className="px-3 py-1 bg-white text-black font-medium rounded-sm hover:bg-white/90 transition-colors shadow-sm flex items-center gap-1"
                  >
                    <span className="material-symbols-outlined text-[14px]">link</span>
                    <span>Create & Link</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- SCREEN 1 & 2: SPATIAL CANVAS SCREEN ---
    function SpatialCanvasScreen({ onOpenQuickCapture }) {
      const [pos1, setPos1] = useState({ x: 60, y: 150 });
      const [pos2, setPos2] = useState({ x: 440, y: 140 });
      const [pos3, setPos3] = useState({ x: 840, y: 140 });
      const [zoom, setZoom] = useState(100);
      const [activeTool, setActiveTool] = useState('V');
      const [mentionOpen, setMentionOpen] = useState(false);
      const [mentionText, setMentionText] = useState('Brand Guid');

      // Draggable state handling
      const draggingRef = useRef(null);

      const handleMouseDown = (e, nodeId) => {
        if (e.target.tagName.toLowerCase() === 'button' || e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'textarea') return;
        draggingRef.current = {
          nodeId,
          startX: e.clientX,
          startY: e.clientY,
          initialPos: nodeId === 1 ? { ...pos1 } : nodeId === 2 ? { ...pos2 } : { ...pos3 }
        };
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!draggingRef.current) return;
          const { nodeId, startX, startY, initialPos } = draggingRef.current;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          if (nodeId === 1) setPos1({ x: Math.max(20, initialPos.x + dx), y: Math.max(20, initialPos.y + dy) });
          if (nodeId === 2) setPos2({ x: Math.max(20, initialPos.x + dx), y: Math.max(20, initialPos.y + dy) });
          if (nodeId === 3) setPos3({ x: Math.max(20, initialPos.x + dx), y: Math.max(20, initialPos.y + dy) });
        };

        const handleMouseUp = () => {
          draggingRef.current = null;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [pos1, pos2, pos3]);

      // Calculate connector curve between Node 1 (right handle) and Node 2 (left handle)
      const p1X = pos1.x + 310;
      const p1Y = pos1.y + 120;
      const p2X = pos2.x;
      const p2Y = pos2.y + 120;
      const dx = Math.abs(p2X - p1X) * 0.5;
      const connectorPath = `M ${p1X} ${p1Y} C ${p1X + dx} ${p1Y}, ${p2X - dx} ${p2Y}, ${p2X} ${p2Y}`;

      return (
        <div className="pl-64 h-screen flex flex-col bg-[#111317] overflow-hidden">
          {/* Header */}
          <header className="h-14 bg-[#111317] border-b border-white/10 z-40 flex items-center justify-between px-8 select-none flex-shrink-0">
            <div className="flex items-center gap-2 text-xs font-mono">
              <span className="text-sm font-medium tracking-tight text-white font-sans">Bisnis A</span>
              <span className="text-text-dim font-light">/</span>
              <span className="text-sm text-text-muted font-normal font-sans">Rebranding & Launch</span>
            </div>

            {/* Center Segmented Tabs */}
            <div className="flex items-center p-0.5 rounded-md bg-[#181a20] border border-white/10">
              <Link to="/canvas" className="px-4 py-1 text-xs text-white bg-[#262932] border border-white/10 rounded font-medium shadow-sm">
                Canvas
              </Link>
              <Link to="/documents" className="px-4 py-1 text-xs text-text-muted hover:text-white transition-colors">
                Documents
              </Link>
              <Link to="/tasks" className="px-4 py-1 text-xs text-text-muted hover:text-white transition-colors">
                Tasks
              </Link>
            </div>

            {/* Right Controls */}
            <div className="flex items-center gap-3">
              <div className="flex items-center border border-white/10 rounded-sm bg-[#181a20] text-text-muted text-xs">
                <button onClick={() => setZoom(z => Math.min(150, z + 10))} className="px-2 py-1.5 hover:text-white transition-colors" title="Zoom In">
                  <span className="material-symbols-outlined text-[15px]">zoom_in</span>
                </button>
                <div className="w-px h-3.5 bg-white/10"></div>
                <button onClick={() => setZoom(100)} className="px-2 py-1.5 hover:text-white transition-colors" title="Fit to Screen">
                  <span className="material-symbols-outlined text-[15px]">fit_screen</span>
                </button>
              </div>
              <button 
                onClick={onOpenQuickCapture}
                className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-white/[0.08] hover:bg-white/[0.14] border border-white/15 rounded-sm transition-all shadow-sm"
              >
                <span className="material-symbols-outlined text-[15px]">add</span>
                <span>New</span>
              </button>
            </div>
          </header>

          {/* Spatial Canvas Stage */}
          <main className="relative flex-1 w-full h-[calc(100vh-3.5rem)] overflow-hidden bg-[#111317]">
            {/* Ambient subtle illumination */}
            <div className="absolute pointer-events-none w-[640px] h-[640px] rounded-full blur-[200px] bg-white/[0.02] top-1/3 left-1/3 z-0"></div>

            {/* Canvas Viewport */}
            <div 
              className="relative w-full h-full select-none" 
              style={{ transform: `scale(${zoom / 100})`, transformOrigin: 'center center' }}
            >
              {/* Dynamic Smooth SVG Connector */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-10" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="connectorGlow" x1="0%" x2="100%" y1="0%" y2="0%">
                    <stop offset="0%" stopColor="#94a3b8" stopOpacity="0.45"></stop>
                    <stop offset="50%" stopColor="#8b8df8" stopOpacity="0.8"></stop>
                    <stop offset="100%" stopColor="#44e1de" stopOpacity="0.65"></stop>
                  </linearGradient>
                  <marker id="dotPoint" markerHeight="6" markerWidth="6" refX="3" refY="3">
                    <circle cx="3" cy="3" fill="#44e1de" opacity="0.9" r="2.5"></circle>
                  </marker>
                </defs>
                <path 
                  d={connectorPath} 
                  fill="none" 
                  markerEnd="url(#dotPoint)" 
                  stroke="url(#connectorGlow)" 
                  strokeDasharray="4 4" 
                  strokeWidth="1.75"
                />
              </svg>

              {/* CARD 01: STRATEGY (WITH SIGNATURE CHAMFERED CUT CORNER) */}
              <article 
                onMouseDown={(e) => handleMouseDown(e, 1)}
                style={{ 
                  left: `${pos1.x}px`, 
                  top: `${pos1.y}px`,
                  clipPath: 'polygon(0px 0px, calc(100% - 14px) 0px, 100% 14px, 100% 100%, 0px 100%)'
                }}
                className="absolute w-[310px] bg-[#16181d] border border-white/15 rounded-sm shadow-2xl p-6 cursor-grab active:cursor-grabbing hover:border-white/30 z-20 transition-shadow"
              >
                {/* Protruding handles */}
                <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-white/30 flex items-center justify-center text-[10px] text-white/70 shadow">+</div>
                <div className="absolute -bottom-3 left-1/2 -translate-x-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-white/30 flex items-center justify-center text-[10px] text-white/70 shadow">+</div>
                <div className="absolute top-1/2 -left-3 -translate-y-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-white/30 flex items-center justify-center text-[10px] text-white/70 shadow">+</div>
                <div className="absolute top-1/2 -right-3 -translate-y-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-primary ring-2 ring-primary/20 flex items-center justify-center text-[10px] text-white shadow font-bold">+</div>

                <div className="flex items-center justify-between mb-4">
                  <span className="text-[11px] font-medium uppercase tracking-widest text-text-dim">Strategy</span>
                  <span className="text-[11px] text-text-dim font-mono">01</span>
                </div>
                <h2 className="text-sm font-semibold tracking-tight text-white mb-3">
                  Brand Identity & Value Pillars
                </h2>
                <div className="space-y-3 text-xs text-text-muted leading-relaxed">
                  <p><span className="text-white font-medium">— Restraint over noise:</span> hyper-intentional negative space and pure typographic hierarchy.</p>
                  <p><span className="text-white font-medium">— Material depth:</span> obsidian glass, muted ash tones, chamfered precision geometry.</p>
                  <p><span className="text-white font-medium">— Context isolation:</span> domain switching without fragmentation.</p>
                </div>
              </article>

              {/* CARD 02: IDEATION */}
              <article 
                onMouseDown={(e) => handleMouseDown(e, 2)}
                style={{ 
                  left: `${pos2.x}px`, 
                  top: `${pos2.y}px`,
                  clipPath: 'polygon(0px 0px, calc(100% - 14px) 0px, 100% 14px, 100% 100%, 0px 100%)'
                }}
                className="absolute w-[340px] bg-[#16181d] border border-white/15 rounded-sm shadow-2xl p-6 cursor-grab active:cursor-grabbing hover:border-white/30 z-20"
              >
                <div className="absolute top-1/2 -left-3 -translate-y-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-secondary ring-2 ring-secondary/20 flex items-center justify-center text-[10px] text-white shadow font-bold">+</div>
                <div className="absolute top-1/2 -right-3 -translate-y-1/2 w-5 h-5 rounded-full bg-[#1e2025] border border-white/30 flex items-center justify-center text-[10px] text-white/70 shadow">+</div>

                <div className="flex items-center justify-between mb-3">
                  <span className="text-[11px] font-medium uppercase tracking-widest text-text-dim">Ideation</span>
                  <span className="text-[11px] text-text-dim font-mono">02</span>
                </div>
                <h2 className="text-sm font-semibold tracking-tight text-white mb-2">
                  The Architects of Silence
                </h2>
                <p className="text-xs text-text-muted leading-relaxed mb-3">
                  Positioning ORCA as an intentional deprivation chamber for high-leverage creative decisions.
                </p>

                {/* Inline @ mention active input */}
                <div className="relative mb-3">
                  <div 
                    onClick={() => setMentionOpen(!mentionOpen)}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded bg-[#111317] border border-white/20 text-xs font-mono text-white cursor-pointer hover:border-white/40 transition-colors"
                  >
                    <span className="text-secondary font-bold bg-secondary/10 px-1 py-0.5 rounded text-[11px]">@</span>
                    <span>{mentionText}</span>
                    <span className="inline-block w-1.5 h-3.5 bg-white animate-pulse"></span>
                  </div>

    // --- MAIN APP ENTRY WITH MEMORY ROUTER ---
    function App() {
      const [isQuickCaptureOpen, setQuickCaptureOpen] = useState(false);

      // Keyboard shortcut ⌘K or Ctrl+K to toggle quick capture
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            setQuickCaptureOpen(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const handleSaveCapture = ({ type, title, note }) => {
        console.log("Captured:", { type, title, note });
      };

      return (
        <MemoryRouter initialEntries={['/canvas']}>
          <div className="flex min-h-screen bg-[#111317] text-[#e2e2e8]">
            <Sidebar onOpenQuickCapture={() => setQuickCaptureOpen(true)} />
            
            <div className="flex-1 w-full min-w-0">
              <Routes>
                <Route path="/" element={<SpatialCanvasScreen onOpenQuickCapture={() => setQuickCaptureOpen(true)} />} />

                <Route path="/canvas-hub" element={<CanvasHubScreen onOpenQuickCapture={() => setQuickCaptureOpen(true)} />} />

                <Route path="/tasks" element={<TasksBoardScreen onOpenQuickCapture={() => setQuickCaptureOpen(true)} />} />
              </Routes>
            </div>

            <QuickCaptureModal 
              isOpen={isQuickCaptureOpen}
              onClose={() => setQuickCaptureOpen(false)}
              onSave={handleSaveCapture}
            />
          </div>
        </MemoryRouter>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
