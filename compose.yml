# =========================================================
# ORCA Production Compose Definition (compose.yml)
# Used for Production deployment with Cloud Postgres (e.g. Supabase)
# and Cloud Redis (e.g. Upstash, managed Redis).
#
# Production Usage:
#   docker compose up -d --build
# =========================================================

services:
  api:
    image: localhost/orca-api:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: orca-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: 8080
      ENV: ${ENV:-production}
      # Production Database (e.g. Supabase connection string)
      DATABASE_URL: ${DATABASE_URL:-}
      # Production Redis (optional / cloud redis)
      REDIS_URL: ${REDIS_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      # Database Auto-Migration upon setup
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      # Security & JWT Secret
      JWT_SECRET: ${JWT_SECRET:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_DEV_WORKSPACE_HEADER: ${ALLOW_DEV_WORKSPACE_HEADER:-false}
      # Object Storage for Images (Supabase, R2, AWS, MinIO, or Local)
      STORAGE_DRIVER: ${STORAGE_DRIVER:-auto}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-auto}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PUBLIC_URL_BASE: ${STORAGE_S3_PUBLIC_URL_BASE:-}
      STORAGE_LOCAL_DIR: /app/uploads
    volumes:
      - orca_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orca-net

  web:
    image: localhost/orca-web:latest
    build:
      context: ./web
      dockerfile: Containerfile
    container_name: orca-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - orca-net

networks:
  orca-net:
    driver: bridge

volumes:
  orca_uploads:
