services:
  web:
    image: orca-demo-web:latest
    build:
      context: ./web
      dockerfile: Containerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3010}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
