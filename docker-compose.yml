services:
  db:
    image: postgres:16-alpine
    container_name: orca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca_secret
      POSTGRES_DB: orca_db
    ports:
      - "5432:5432"
    volumes:
      - orca_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - orca_redisdata:/data

volumes:
  orca_pgdata:
  orca_redisdata:
