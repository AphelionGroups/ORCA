server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options "nosniff" always;
    # Restrict embedding to your landing page and local preview.
    # Also configure any upstream proxy/CDN to allow these frame ancestors.
    add_header Content-Security-Policy "frame-ancestors 'self' https://orca.ocaty.com http://localhost:* http://127.0.0.1:*" always;
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
    }
    location /api/ { return 404; }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://orca.ocaty.com http://localhost:* http://127.0.0.1:*" always;
        try_files $uri $uri/ /index.html;
    }
}
