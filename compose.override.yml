# =========================================================
# ORCA Local Development Override (compose.override.yml)
# Automatically merged by Docker Compose in development.
# Spawns local PostgreSQL 16 and Redis 7 with demo seed data.
#
# Development Usage:
#   docker compose up -d --build
# =========================================================

services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: orca-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orca_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orca_pgdata:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./scripts/seed_demo.sql:/docker-entrypoint-initdb.d/02_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca} -d ${POSTGRES_DB:-orca_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orca-net

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - orca_redisdata:/data
    networks:
      - orca-net

  api:
    environment:
      ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgres://orca:orca_secret@db:5432/orca_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  orca_pgdata:
  orca_redisdata:

networks:
  orca-net:
